name: Desktop Client Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 私有 jdc-code 的分支、标签或完整 commit SHA
        required: true
        default: main
        type: string
      deploy:
        description: 构建成功后上传到生产 Cloud API
        required: false
        default: false
        type: boolean
      platform:
        description: 构建平台
        required: true
        default: all
        type: choice
        options:
          - all
          - mac
          - win

concurrency:
  group: desktop-client-release-${{ inputs.source_ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: u53/jdc-code
  RELEASE_API_URL: ${{ vars.JDC_CLOUD_API_URL }}
  CLIENT_CLOUD_API_URL: https://admin.jdccode.com

jobs:
  prepare:
    name: Resolve private source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: 检出私有源码
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.JDC_SOURCE_REPO_SSH_KEY }}
          persist-credentials: false
          path: source

      - name: 固定源码与版本
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          VERSION="$(node -p "require('./source/apps/desktop-client/package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::客户端版本格式无效：${VERSION}"
            exit 1
          fi
          if [ "${{ inputs.deploy }}" = "true" ] && [ "${{ inputs.platform }}" != "all" ]; then
            echo "::error::部署发布必须选择 platform=all；单平台仅生成 Artifact"
            exit 1
          fi
          if [ -z "${RELEASE_API_URL:-}" ]; then
            echo "::error::缺少仓库变量 JDC_CLOUD_API_URL"
            exit 1
          fi
          case "$RELEASE_API_URL" in
            https://api.jdccode.com|https://api.jdccode.com/ ) ;;
            *)
              echo "::error::拒绝非生产上传目标：${RELEASE_API_URL}"
              exit 1
              ;;
          esac
          {
            echo "source_sha=$SOURCE_SHA"
            echo "version=$VERSION"
            echo "release_tag=desktop-v${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ${SOURCE_REPOSITORY}@${SOURCE_SHA} (desktop-v${VERSION})"

  build:
    name: Build (${{ matrix.platform }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            dist_script: dist:mac
          - os: windows-latest
            platform: win
            dist_script: dist:win
    steps:
      - name: 按输入过滤平台
        id: filter
        shell: bash
        run: |
          if [ "${{ inputs.platform }}" = "all" ] || [ "${{ inputs.platform }}" = "${{ matrix.platform }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出已固定的私有源码
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.JDC_SOURCE_REPO_SSH_KEY }}
          persist-credentials: false
          path: source

      - name: 安装 pnpm
        if: steps.filter.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: 安装 Node.js
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: 安装依赖
        if: steps.filter.outputs.run == 'true'
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: 编译 workspace 依赖
        if: steps.filter.outputs.run == 'true'
        working-directory: source/apps/desktop-client
        run: pnpm build:deps

      - name: 重建原生模块
        if: steps.filter.outputs.run == 'true'
        working-directory: source/apps/desktop-client
        run: pnpm rebuild:native

      - name: 导入 Mac Developer ID 证书
        if: steps.filter.outputs.run == 'true' && matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "::error::缺少 CSC_LINK 或 CSC_KEY_PASSWORD，无法签名 macOS 安装包"
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/jdc-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/jdc-build.keychain-db"
          printf '%s' "$CSC_LINK" | base64 -D > "$CERT_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"
          rm "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: 打包 Electron
        if: steps.filter.outputs.run == 'true'
        working-directory: source/apps/desktop-client
        env:
          VITE_JDC_CLOUD_API: ${{ env.CLIENT_CLOUD_API_URL }}
          JDC_CLOUD_API: ${{ env.CLIENT_CLOUD_API_URL }}
          VITE_JDC_EXTENSION_MARKETPLACE: '1'
          VITE_JDC_WEBSITE_BASE_URL: https://jdccode.com
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && 'true' || 'false' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          node -e "if (process.env.VITE_JDC_EXTENSION_MARKETPLACE !== '1') throw new Error('正式构建必须启用 Marketplace')"
          pnpm ${{ matrix.dist_script }}

      - name: 校验 macOS 签名
        if: steps.filter.outputs.run == 'true' && matrix.platform == 'mac'
        shell: bash
        working-directory: source/apps/desktop-client
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/JDC\ Code.app release/mac*/JDCCode.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::未找到已打包的 macOS .app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign -dv --verbose=4 "${apps[0]}" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier='

      - name: 收集发布文件
        if: steps.filter.outputs.run == 'true'
        shell: bash
        working-directory: source/apps/desktop-client
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jdc-release-${{ matrix.platform }}"
          shopt -s nullglob
          if [ "${{ matrix.platform }}" = "mac" ]; then
            installers=(release/*.dmg)
            files=(release/*.dmg release/*.dmg.blockmap release/*-mac.zip release/*-mac.zip.blockmap release/latest-mac.yml)
          else
            installers=(release/*Setup*.exe)
            files=(release/*Setup*.exe release/*Setup*.exe.blockmap release/latest.yml)
          fi
          if [ "${#installers[@]}" -eq 0 ] || [ "${#files[@]}" -eq 0 ]; then
            echo "::error::未找到 ${{ matrix.platform }} 的安装包和更新元数据"
            exit 1
          fi
          cp "${files[@]}" "$RUNNER_TEMP/jdc-release-${{ matrix.platform }}/"

      - name: 上传短期构建 Artifact
        if: steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jdc-desktop-${{ matrix.platform }}-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/jdc-release-${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Upload candidate to JDC Cloud API
    needs: [prepare, build]
    if: inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v8
        with:
          pattern: jdc-desktop-*-${{ needs.prepare.outputs.version }}
          path: artifacts
          merge-multiple: true

      - name: 检出已固定的发布说明
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.JDC_SOURCE_REPO_SSH_KEY }}
          persist-credentials: false
          path: source

      - name: 上传并完成 Cloud API 候选版本
        shell: bash
        env:
          API_URL: ${{ env.RELEASE_API_URL }}
          UPLOAD_TOKEN: ${{ secrets.JDC_RELEASE_UPLOAD_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_ID: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${UPLOAD_TOKEN:-}" ]; then
            echo "::error::缺少 JDC_RELEASE_UPLOAD_TOKEN"
            exit 1
          fi
          if [ "${REQUESTED_PLATFORM:-all}" != "all" ]; then
            echo "::error::候选发布必须选择 platform=all；单平台模式仅用于构建 Artifact"
            exit 1
          fi
          shopt -s nullglob
          files=(artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::没有可上传的构建产物"
            exit 1
          fi
          version_file=""
          if [ -f artifacts/latest.yml ]; then
            version_file="artifacts/latest.yml"
          elif [ -f artifacts/latest-mac.yml ]; then
            version_file="artifacts/latest-mac.yml"
          fi
          if [ -z "$version_file" ]; then
            echo "::error::未找到 latest.yml 或 latest-mac.yml，无法确认候选版本"
            exit 1
          fi
          ARTIFACT_VERSION="$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\"]+)['\"]?[[:space:]]*$/\1/p" "$version_file" | head -n 1)"
          if [ -z "$ARTIFACT_VERSION" ] || [ "$ARTIFACT_VERSION" != "$VERSION" ]; then
            echo "::error::安装包版本 ${ARTIFACT_VERSION:-missing} 与源码版本 ${VERSION} 不一致"
            exit 1
          fi
          NOTES_DOCUMENT_PATH="docs/releases/${VERSION}.md"
          NOTES_FILE="source/${NOTES_DOCUMENT_PATH}"
          node source/scripts/validate-desktop-release-notes.mjs "$NOTES_FILE" "$VERSION"
          PUBLIC_BEFORE="$(curl -sfS "${API_URL%/}/api/jdc/v1/releases/latest")"
          NOTES_FILE="$NOTES_FILE" NOTES_DOCUMENT_PATH="$NOTES_DOCUMENT_PATH" RUN_ID="$GITHUB_RUN_ID" RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT_VALUE" node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readdirSync, readFileSync, statSync, writeFileSync } = require('node:fs');
          const { basename, join } = require('node:path');
          const files = readdirSync('artifacts').map((name) => join('artifacts', name)).filter((path) => statSync(path).isFile());
          const artifacts = files.flatMap((path) => {
            const fileName = basename(path);
            if (fileName === 'builder-debug.yml' || fileName === 'builder-effective-config.yaml') return [];
            let platform;
            let kind;
            if (/^latest-mac\.ya?ml$/i.test(fileName)) { platform = 'mac'; kind = 'metadata'; }
            else if (/^latest\.ya?ml$/i.test(fileName)) { platform = 'win'; kind = 'metadata'; }
            else if (/\.dmg$/i.test(fileName)) { platform = 'mac'; kind = 'installer'; }
            else if (/-mac\.zip$/i.test(fileName)) { platform = 'mac'; kind = 'updater_archive'; }
            else if (/\.(?:exe|msi)$/i.test(fileName)) { platform = 'win'; kind = 'installer'; }
            else if (/\.blockmap$/i.test(fileName)) { platform = /(?:dmg|-mac\.zip)/i.test(fileName) ? 'mac' : 'win'; kind = 'blockmap'; }
            else return [];
            const arch = /(?:arm64|aarch64)/i.test(fileName) ? 'arm64' : /universal/i.test(fileName) ? 'universal' : 'x64';
            const bytes = readFileSync(path);
            return [{
              fileName,
              kind,
              platform,
              arch,
              sizeBytes: bytes.length,
              sha256: createHash('sha256').update(bytes).digest('hex'),
            }];
          }).sort((a, b) => a.fileName.localeCompare(b.fileName));
          const request = {
            schemaVersion: 'jdc.client-release-candidate-create.v1',
            version: process.env.VERSION,
            sourceCommitSha: process.env.SOURCE_SHA,
            sourceRef: process.env.SOURCE_SHA,
            buildId: process.env.BUILD_ID,
            githubRunId: process.env.RUN_ID,
            githubRunAttempt: Number(process.env.RUN_ATTEMPT),
            requiredPlatforms: ['mac', 'win'],
            expectedArtifacts: artifacts,
            releaseNotes: {
              format: 'markdown',
              content: readFileSync(process.env.NOTES_FILE, 'utf8'),
              sourceDocumentPath: process.env.NOTES_DOCUMENT_PATH,
            },
          };
          writeFileSync('candidate-request.json', JSON.stringify(request));
          NODE
          CREATE_RESPONSE="$(curl --fail-with-body --silent --show-error -X POST "${API_URL%/}/api/jdc/v1/releases/candidates" \
            -H "Authorization: Bearer ${UPLOAD_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @candidate-request.json)"
          CANDIDATE_ID="$(CREATE_RESPONSE="$CREATE_RESPONSE" node -e "const v=JSON.parse(process.env.CREATE_RESPONSE); if(typeof v.candidateId!=='string') throw new Error('candidateId missing'); process.stdout.write(v.candidateId)")"
          EXPECTED_COUNT="$(node -e "process.stdout.write(String(JSON.parse(require('node:fs').readFileSync('candidate-request.json')).expectedArtifacts.length))")"
          uploaded=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            expected="$(FILE_NAME="$name" node -e "const q=JSON.parse(require('node:fs').readFileSync('candidate-request.json')); const a=q.expectedArtifacts.find(x=>x.fileName===process.env.FILE_NAME); if(a) process.stdout.write(JSON.stringify(a))")"
            [ -n "$expected" ] || continue
            encoded="$(FILE_NAME="$name" node -e "process.stdout.write(encodeURIComponent(process.env.FILE_NAME))")"
            size="$(EXPECTED="$expected" node -e "process.stdout.write(String(JSON.parse(process.env.EXPECTED).sizeBytes))")"
            sha="$(EXPECTED="$expected" node -e "process.stdout.write(JSON.parse(process.env.EXPECTED).sha256)")"
            echo "Uploading candidate artifact ${name} sha256=${sha:0:12}"
            curl --fail-with-body --silent --show-error -X PUT "${API_URL%/}/api/jdc/v1/releases/candidates/${CANDIDATE_ID}/files/${encoded}" \
              -H "Authorization: Bearer ${UPLOAD_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "Content-Length: ${size}" \
              -H "X-JDC-Signature-Status: unsigned" \
              --data-binary "@${file}"
            uploaded=$((uploaded + 1))
          done < <(find artifacts -maxdepth 1 -type f -print | sort)
          if [ "$uploaded" -ne "$EXPECTED_COUNT" ]; then
            echo "::error::候选上传数量错误：expected=${EXPECTED_COUNT} actual=${uploaded}"
            exit 1
          fi
          FINALIZE_RESPONSE="$(curl --fail-with-body --silent --show-error -X POST "${API_URL%/}/api/jdc/v1/releases/candidates/${CANDIDATE_ID}/finalize" \
            -H "Authorization: Bearer ${UPLOAD_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "$(node -e "process.stdout.write(JSON.stringify({schemaVersion:'jdc.client-release-candidate-finalize.v1',sourceCommitSha:process.env.SOURCE_SHA,buildId:process.env.BUILD_ID}))")")"
          FINALIZE_RESPONSE="$FINALIZE_RESPONSE" EXPECTED_VERSION="$VERSION" node <<'NODE'
          const value = JSON.parse(process.env.FINALIZE_RESPONSE);
          if (value.state !== 'ready' || value.public !== false || value.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`候选 finalize 响应非法：${JSON.stringify(value)}`);
          }
          NODE
          PUBLIC_AFTER="$(curl -sfS "${API_URL%/}/api/jdc/v1/releases/latest")"
          PUBLIC_BEFORE="$PUBLIC_BEFORE" PUBLIC_AFTER="$PUBLIC_AFTER" node <<'NODE'
          const before = JSON.parse(process.env.PUBLIC_BEFORE);
          const after = JSON.parse(process.env.PUBLIC_AFTER);
          if (before.latestVersion !== after.latestVersion) {
            throw new Error(`候选上传提前改变了 public latest：before=${before.latestVersion} after=${after.latestVersion}`);
          }
          NODE
          {
            echo "## Candidate ready for manual review"
            echo ""
            echo "- Candidate: \`${CANDIDATE_ID}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Artifacts: ${uploaded}"
            echo "- Public latest unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate ready: ${CANDIDATE_ID}; no public release was performed."
